<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="%PAGE_BG%" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="GymMate - Tu compañero de entrenamiento personal. Tracking de volumen, PRs y progreso." />

  <title>GymMate - Tu Compañero de Entrenamiento</title>

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />

  <!-- Apple Touch Icons for iOS -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="GymMate" />

  <!-- PWA Manifest is injected by vite-plugin-pwa -->

  <!-- Fuentes FIERRO self-hosted: precarga para el primer render -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/archivo-latin.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/instrument-sans-latin.woff2" crossorigin />

  <!-- Critical inline CSS for fallback (colores y tipografia: src/styles/tokens.css) -->
  <style>
    /* Pinta antes de que llegue el bundle, asi que NO puede depender de el:
       los valores los inyecta vite desde src/styles/tokens.css,
       que sigue siendo la unica fuente de verdad. */
    .hidden { display: none !important; }
    body {
      background-color: %PAGE_BG%;
      color: %TEXT_PRIMARY%;
      font-family: 'Instrument Sans', system-ui, -apple-system, sans-serif;
    }
    /* Skip Link - visible on focus */
    .skip-link {
      position: absolute;
      top: -100%;
      left: 50%;
      transform: translateX(-50%);
      background: %ACCENT%;
      color: %ON_ACCENT%;
      padding: 0.75rem 1.5rem;
      border-radius: 0 0 %RADIUS_BTN% %RADIUS_BTN%;
      font-weight: 700;
      z-index: 9999;
      transition: top 0.2s;
    }
    .skip-link:focus {
      top: 0;
      outline: 3px solid %TEXT_PRIMARY%;
      outline-offset: 2px;
    }
  </style>
</head>
<body class="bg-dark-bg text-text-primary">

  <!-- Skip Link for keyboard navigation - WCAG 2.4.1 -->
  <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

  <!-- Screen Reader Announcements - WCAG 4.1.3 -->
  <div id="srAnnouncements" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- Indicador de cambios sin guardar -->
  <div id="unsavedIndicator" class="unsaved-indicator hidden" role="status" aria-live="polite">
    Cambios sin guardar
  </div>

  <!-- Banner del descanso. El mockup no lo dibuja como pantalla propia: W-01
       tiene el bloque de descanso y el cronometro. Este banner es el aviso
       flotante que sobrevive al cambio de pantalla, y se viste con el sistema
       —card Carbon, boton claro, destructivo en rojo— en vez de con Tailwind. -->
  <div id="restTimerBanner" class="f-descanso f-root" role="timer" aria-label="Temporizador de descanso">
    <div class="f-descanso__textos">
      <span class="f-descanso__label" id="timerLabel">DESCANSO</span>
      <span class="f-descanso__cifra" id="timerDisplay" aria-live="off">00:00</span>
    </div>
    <div class="f-descanso__acciones">
      <button id="pauseTimer" type="button" class="f-btn--claro f-descanso__btn" aria-label="Pausar temporizador">Pausar</button>
      <button id="stopTimer" type="button" class="f-btn--detener f-descanso__btn" aria-label="Detener temporizador">✕</button>
    </div>
  </div>

  <!-- Main Container -->
  <!-- Sin padding: cada pantalla FIERRO trae el suyo (el mockup pone uno
       solo, de 20px). Las pantallas legacy lo reciben desde .tab-content en
       main.css hasta que su fase las reemplace. -->
  <main id="main-content" role="main" tabindex="-1">

    <!-- ==========================================
         HOME VIEW
         ========================================== -->
    <div id="homeView" role="region" aria-label="Página principal">
      <!-- H-01 lo pinta entero src/ui/home.ts. Todo el markup Tailwind
           anterior se retiro con el rediseno FIERRO. -->
      <div id="fierroHome"></div>
    </div>

    <!-- ==========================================
         WORKOUT TAB
         ========================================== -->
    <div id="workoutTab" class="tab-content hidden" role="region" aria-label="Sesión de entrenamiento">
      <!-- W-01 lo pinta entero src/ui/workout-view.ts. El markup Tailwind
           anterior (hero de stats, cards de ejercicio, resumen de volumen y
           botonera) se retiro con el rediseno FIERRO. -->
      <div id="fierroWorkout"></div>
    </div>

    <!-- ==========================================
         CA-01 / CA-02 · CALCULADORAS  (render en src/ui/perfil.ts)
         ========================================== -->
    <div id="calculatorsTab" class="tab-content hidden" role="region" aria-label="Calculadoras">
      <!-- Rendered dynamically by ui/perfil.ts -->
    </div>

    <!-- ==========================================
         CHARTS TAB
         ========================================== -->
    <div id="chartsTab" class="tab-content hidden" role="region" aria-label="Gráficos de progreso">
      <!-- G-01 lo pinta src/ui/hueso.ts. -->
      <div id="fierroGraficos"></div>
    </div>

    <!-- ==========================================
         HISTORY TAB
         ========================================== -->
    <div id="historyTab" class="tab-content hidden" role="region" aria-label="Historial de entrenamientos">
      <!-- HI-01 y HI-02 los pinta src/ui/hueso.ts. -->
      <div id="fierroHistorial"></div>
    </div>

    <!-- ==========================================
         PRS TAB
         ========================================== -->
    <div id="prsTab" class="tab-content hidden" role="region" aria-label="Récords personales">
      <!-- PR-01 lo pinta src/ui/hueso.ts. -->
      <div id="fierroRecords"></div>
    </div>

    <!-- ==========================================
         PROFILE TAB
         ========================================== -->
    <div id="profileTab" class="tab-content hidden" role="region" aria-label="Perfil">
      <!-- Rendered dynamically by ui/perfil.ts -->
    </div>

    <!-- ==========================================
         P-03 · HISTORIAL DE MEDIDAS (Hueso)
         ========================================== -->
    <div id="medidasTab" class="tab-content hidden" role="region" aria-label="Historial de medidas">
      <!-- Rendered dynamically by ui/perfil.ts -->
    </div>

    <!-- ==========================================
         CARDIO VIEWS
         ========================================== -->

    <!-- Cardio Selector View -->
    <div id="cardioSelectorView" class="hidden" role="region" aria-label="Selección de modo cardio">
      <!-- Rendered dynamically by cardio.ts -->
    </div>

    <!-- Cardio Config View -->
    <div id="cardioConfigView" class="hidden" role="region" aria-label="Configuración de cardio">
      <!-- Rendered dynamically by cardio.ts -->
    </div>

    <!-- Cardio Timer View -->
    <div id="cardioTimerView" class="hidden" role="region" aria-label="Temporizador de cardio">
      <!-- Rendered dynamically by cardio.ts -->
    </div>

    <!-- Cardio Summary View -->
    <div id="cardioSummaryView" class="hidden" role="region" aria-label="Resumen de cardio">
      <!-- Rendered dynamically by cardio.ts -->
    </div>

  </main>

  <!-- ==========================================
       BOTTOM NAVIGATION
       ========================================== -->
  <nav class="f-tabbar f-root" role="navigation" aria-label="Navegación principal">
    <button data-nav="home" class="f-tabbar__item" aria-current="page" aria-label="Ir a inicio">
      <span class="f-tabbar__punto" aria-hidden="true"></span>
      <span class="f-tabbar__label">INICIO</span>
    </button>
    <button data-nav="history" class="f-tabbar__item" aria-label="Ir a historial">
      <span class="f-tabbar__punto" aria-hidden="true"></span>
      <span class="f-tabbar__label">HISTORIAL</span>
    </button>
    <div class="f-fab-hueco">
      <button id="fabButton" class="f-fab" aria-label="Crear nueva rutina o iniciar entrenamiento" aria-haspopup="true">+</button>
    </div>
    <button data-nav="progress" class="f-tabbar__item" aria-label="Ir a progreso">
      <span class="f-tabbar__punto" aria-hidden="true"></span>
      <span class="f-tabbar__label">PROGRESO</span>
    </button>
    <button data-nav="profile" class="f-tabbar__item" aria-label="Ir a mi perfil">
      <span class="f-tabbar__punto" aria-hidden="true"></span>
      <span class="f-tabbar__label">PERFIL</span>
    </button>
  </nav>

  <!-- ==========================================
       MODALS
       ========================================== -->

  <!-- La hoja de descanso NO vive aqui. Se monta al abrirla, como el resto de
       los bottom sheets: una hoja permanentemente montada y oculta hace que
       cualquier `querySelector('.f-sheet')` de documento entero la encuentre a
       ella, y varios chequeos dejaron de poder fallar por eso. -->

  <!-- Workout Builder Modal -->
  <!-- B-01 · el builder de rutinas lo pinta src/ui/builder.ts sobre un
       contenedor que crea el propio modulo. El modal legacy que habia aqui
       (~105 lineas de Tailwind) se retira con el. -->


  <!-- Body Measurements Modal -->

  <!-- Measurements History Modal -->

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
