[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # PWA-09: sin esto, Netlify usa su versión de Node por defecto (puede
  # cambiar entre builds); se fija a la misma que @types/node en devDependencies.
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/*.ts"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    # CSP en modo Report-Only (no bloqueante): la UI actual todavía usa onclick
    # inline en varios puntos (index.html y varios .ts) que no interpolan datos
    # de usuario y por tanto no son vector de XSS, pero sí romperían una CSP
    # estricta con script-src 'self' sin 'unsafe-inline'. Ver FIXES_APPLIED.md
    # (sección Grupo B) para el detalle de qué queda pendiente de eliminar
    # antes de poder pasar esta CSP a modo bloqueante.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://raw.githubusercontent.com; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
